# Hermes Agent, Nous Research's agent, packaged for the platform at
# shpyrd-io/hermes: the official image with a setup screen in front of the
# dashboard. The first visit asks the provider, the key and the model;
# messaging channels are added afterwards, from the dashboard or a shell.
catalog:
  name: Hermes Agent
  description: Nous Research's self-improving agent, with a web dashboard. Telegram, Discord and the other channels are connected after the install.
  category: agents
  tags: [agent, python, llm, nous]
  icon: headset
  color: violet
  publisher: shpyrd
  license: MIT
  homepage: https://hermes-agent.nousresearch.com
  source:
    git: https://github.com/shpyrd-io/hermes
    revision: main
  inputs:
    # Optional: with it, the setup screen offers OpenRouter without asking
    # the key again. Hermes reads it from the environment.
    - name: OPENROUTER_API_KEY
      label: OpenRouter API key
      help: Optional. From openrouter.ai/keys; the setup screen can take it later instead. Kept as a secret of the project.
      secret: true
  volumes:
    - name: data
      size: 10Gi
processes:
  web:
    port: 8080
    size: shared-xl
    volumes:
      - name: data
        path: /opt/data
build:
  strategy: dockerfile
