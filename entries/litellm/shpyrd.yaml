# LiteLLM, BerriAI's gateway in front of the model providers, packaged for
# the platform at shpyrd-io/litellm: the official image with a script that
# makes LiteLLM's keys from the two seeds generated here (MASTER_KEY_SEED
# and SALT_KEY_SEED). Models, virtual keys and spend live in the Postgres
# the install creates. The project's
# access must be "identified" for LiteLLM's own keys to reach it: the
# readme says why.
catalog:
  name: LiteLLM
  description: One OpenAI-compatible address in front of 100+ model providers, with virtual keys, budgets, spend tracking and an admin UI.
  category: ai
  tags: [llm, gateway, proxy, openai, python]
  icon: route
  color: blue
  publisher: shpyrd
  license: MIT
  homepage: https://docs.litellm.ai
  source:
    git: https://github.com/shpyrd-io/litellm
    revision: main
  inputs:
    - name: UI_USERNAME
      label: Admin user
      help: The name the administrator signs in to the admin UI with.
      default: admin
    # The password of LiteLLM's own login for the install user. Made at
    # install and kept with the project's secrets, as UI_PASSWORD: it is
    # not asked. People with the admin or developer role on the project
    # do not need it, they are signed in by the platform.
    - name: UI_PASSWORD
      label: Admin password
      secret: true
      generate: 32
    # LiteLLM's master key is made from this, with "sk-" in front: the
    # administrator's API key.
    - name: MASTER_KEY_SEED
      label: Master key seed
      secret: true
      generate: 32
    # The key that encrypts the provider keys kept in the database. Made
    # at install and kept with the project's secrets: it must never
    # change once a model is added.
    - name: SALT_KEY_SEED
      label: Salt key seed
      secret: true
      generate: 32
  resources:
    - kind: postgres
      name: db
processes:
  web:
    port: 4000
    # LiteLLM asks for 1 CPU and 4Gi per instance, and calls 4Gi a floor.
    size: shared-xl
    memory: 4Gi
    # Answers without a key, and only once the proxy is up; the first
    # start also runs the database migrations.
    healthCheck:
      path: /health/liveliness
      gracePeriod: 120s
build:
  strategy: dockerfile
